<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLAME - Launching Soon</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: var(--color-bg-base);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }
    .teaser-card {
      background: white;
      border: 1px solid var(--color-border);
      border-radius: 24px;
      padding: 60px 40px;
      max-width: 600px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow-md);
      z-index: 10;
      position: relative;
    }
    .teaser-logos {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 30px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }
    .teaser-logo-img {
      max-height: 55px;
      width: auto;
    }
    .teaser-title {
      font-family: var(--font-serif);
      font-size: 2.8rem;
      font-weight: 800;
      color: var(--color-text-main);
      margin: 0 0 20px 0;
      background: linear-gradient(135deg, var(--color-primary-blue) 0%, var(--color-primary-gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .teaser-text {
      font-family: var(--font-sans);
      font-size: 1.05rem;
      color: var(--color-text-muted);
      line-height: 1.6;
      margin: 0 0 40px 0;
    }
    .teaser-footer {
      font-family: var(--font-sans);
      font-size: 0.85rem;
      color: var(--color-text-muted);
    }
    .secret-trigger {
      cursor: pointer;
      user-select: none;
      transition: color 0.2s ease;
    }
    .secret-trigger:hover {
      color: var(--color-primary-gold);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <!-- Floating decorative blobs -->
  <div class="floating-blob blob-1" style="opacity: 0.6; width: 400px; height: 400px;"></div>
  <div class="floating-blob blob-2" style="opacity: 0.5; width: 500px; height: 500px; right: -10%; bottom: -10%;"></div>

  <div class="teaser-card">
    <div class="teaser-logos">
      <img src="assets/flame-logo.png" alt="FLAME Logo" class="teaser-logo-img">
      <img src="assets/mla-initiative.png" alt="Adv. N. Samsudheen Initiative" class="teaser-logo-img" style="max-height: 48px;">
    </div>
    
    <h1 class="teaser-title">Launching Soon</h1>
    <p class="teaser-text">We are igniting the flame of knowledge and opportunity across the Mannarkkad constituency. Our official digital platform will be live shortly.</p>
    
    <div class="teaser-footer">
      &copy; <span class="secret-trigger" onclick="window.location.href='portal.html'">2026</span> FLAME. All rights reserved.
    </div>
  </div>
</body>
</html>
